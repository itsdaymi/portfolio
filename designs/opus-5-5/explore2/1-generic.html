<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daymi&lt;unknown&gt;</title>
<style>
@font-face {
  font-family: rec;
  src: url("../fonts/recursive-full.woff2") format("woff2");
  font-weight: 300 1000;
}
:root {
  --paper: #f4f2ee;
  --ink: #121212;
  --muted: #6b6b6b;
  --accent: #2b62c9;
  --pad: clamp(16px, 7vw, 112px);
  --w: min(12.4vw, 184px);
  --kc: 132px;
  --gap: 28px;
  --axis: 50vw;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #111212; --ink: #ebe9e4; --muted: #8e8c88; --accent: #6f9cf2; }
}
* { box-sizing: border-box; }
html {
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.5 rec, ui-monospace, monospace;
  font-variation-settings: "MONO" 0, "CASL" 0, "CRSV" 0.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { margin: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
.mono { font-variation-settings: "MONO" 1, "CASL" 0, "CRSV" 0; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- top line: the union, also a plain way to switch ---- */
.top { padding: 28px var(--pad) 0; font-size: 13px; color: var(--muted); }
.top button {
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 0; cursor: pointer;
}
.top button:hover { color: var(--ink); }
.top button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 0.3em; }

/* ---- hero: daymi<T> ---- */
.hero {
  display: flex;
  align-items: baseline;
  padding: 0 var(--pad);
  margin-top: calc(var(--w) * 0.92);
  white-space: nowrap;
}
.word {
  margin: 0;
  font-size: var(--w);
  font-weight: 1000;
  line-height: 0.9;
  letter-spacing: -0.035em;
}
.arg {
  display: flex;
  align-items: baseline;
  font-size: calc(var(--w) * 0.5);
  line-height: 1.1;
  font-weight: 400;
  padding-left: 0.06em;
}
.br { font-weight: 300; }
.drum { position: relative; display: inline-block; height: 1.1em; outline: none; }
.sizer { visibility: hidden; display: inline-block; width: 0; white-space: nowrap; }
.win {
  position: absolute;
  left: 0;
  top: -2.4em;
  width: 10.5ch;
  height: 5.9em;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.win.held { cursor: grabbing; }
.opt {
  position: absolute;
  left: 0;
  top: 2.4em;
  line-height: 1.1;
  white-space: nowrap;
  transform-origin: 0 50%;
  backface-visibility: hidden;
  will-change: transform, opacity;
}
.drum:focus-visible::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -0.02em;
  height: 2px;
  background: var(--ink);
}

/* ---- the specialised part ---- */
.view {
  position: relative;
  display: grid;
  grid-template-columns: var(--kc) minmax(0, min(36rem, calc(100vw - var(--axis) - var(--pad))));
  column-gap: var(--gap);
  align-items: baseline;
  padding: 0 var(--pad) 0 max(var(--pad), calc(var(--axis) - var(--kc) - var(--gap)));
  margin-top: calc(var(--w) * 0.8);
  min-height: 15rem;
}
.view > .k { grid-column: 1; grid-row: var(--r); text-align: right; font-size: 13px; color: var(--muted); }
.view > .v { grid-column: 2; grid-row: var(--r); margin-bottom: 8px; }
.view > .v.end { margin-bottom: 26px; }
.view > .ghost { position: absolute; grid-row: auto; grid-column: auto; margin: 0; pointer-events: none; }
.v p { margin: 0; }
.lead { font-size: clamp(19px, 1.1vw + 7px, 24px); line-height: 1.42; max-width: 30em; text-wrap: pretty; }
.hint { font-size: 14px; color: var(--muted); }
.lk { font-size: 20px; }
.ph { color: var(--muted); }
.proj .pn { font-size: 22px; font-weight: 640; text-decoration: none; }
.proj .pn:hover, .proj .pn:focus-visible { text-decoration: underline; }
.proj .py { font-size: 12px; color: var(--muted); margin-left: 10px; }
.proj p { margin-top: 2px; font-size: 16px; line-height: 1.45; max-width: 32em; color: color-mix(in srgb, var(--ink) 80%, var(--paper)); }
.sum { margin: 0; font-size: 13.5px; line-height: 1.6; }
.sum div { padding-left: 10ch; text-indent: -10ch; }
.sum span { display: inline-block; width: 10ch; text-indent: 0; color: var(--muted); }

.foot { margin-top: auto; padding: 56px var(--pad) 28px; font-size: 12px; color: var(--muted); }

@media (max-width: 719px) {
  :root { --w: min(26.5vw, 128px); }
  .top { font-size: 12px; }
  #union { display: block; padding-left: 2ch; }
  .hero { flex-wrap: wrap; margin-top: calc(var(--w) * 0.95); }
  .word { flex-basis: 100%; }
  .arg { margin-top: 0.8em; padding-left: 0; }
  .view { display: block; padding: 0 var(--pad); margin-top: calc(var(--w) * 0.9); }
  .view > .k { text-align: left; margin-top: 16px; margin-bottom: 1px; }
  .view > .k + .v { margin-top: 0; }
  .view > .v.end { margin-bottom: 18px; }
  .lk { font-size: 18px; }
  .proj .pn { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .opt { will-change: auto; }
}
</style>
</head>
<body>
<nav class="top mono" aria-label="who is reading">type Reader = <span id="union"></span></nav>

<div class="hero">
  <h1 class="word">daymi</h1>
  <span class="arg mono">
    <span class="br" aria-hidden="true">&lt;</span><span class="drum" id="drum" role="listbox" tabindex="0" aria-label="type argument: who is reading"><span class="sizer" aria-hidden="true">unknown</span><span class="win" id="win"></span></span><span class="br" aria-hidden="true">&gt;</span>
  </span>
</div>
<p class="sr">pick who you are, and the page below changes for you.</p>

<main class="view" id="view" aria-live="polite"></main>

<footer class="foot mono">© 2026 daniel kistner</footer>

<script src="data.js"></script>
<script>
(() => {
  const D = window.DATA;
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const TYPES = ['unknown', 'Recruiter', 'Developer', 'Friend', 'Agent'];
  const N = TYPES.length;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const link = Object.fromEntries(D.links.map((l) => [l.href.startsWith('mailto:') ? 'email' : l.label, l]));
  const host = (u) => u.replace(/^https?:\/\//, '').replace(/^mailto:/, '');

  /* ---------- content atoms. same facts, every reader ---------- */

  const proj = (p) => `<div class="proj"><a class="pn" href="${esc(p.url)}">${esc(p.name)}</a><span class="py mono">${p.year}</span><p>${esc(p.blurb)}</p></div>`;
  const names = D.projects.map((p) => p.name);
  const summary = [
    ['alias', D.name],
    ['name', D.full],
    ['study', 'applied computer science, hochschule offenburg'],
    ['work', 'working student, frei gmbh'],
    ['builds', 'things with ai agents, and things for them'],
    ['projects', names.join(', ')],
    ['contact', host(link.email.href)],
  ].map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join('');

  const ATOM = {
    intro: `<p class="lead">i'm ${esc(D.full)}. i study ${esc(D.study)}, work as a ${esc(D.work)}, and build things with ai agents, and things for them.</p>`,
    hint: `<p class="hint mono">pick a type argument.</p>`,
    github: `<a class="lk" href="${link.github.href}">${host(link.github.href)}</a>`,
    x: `<a class="lk" href="${link.x.href}">${host(link.x.href)}</a>`,
    email: `<a class="lk" href="${link.email.href}">${host(link.email.href)}</a>`,
    study: `<p class="lk">applied computer science, hochschule offenburg</p>`,
    work: `<p class="lk">working student, frei gmbh</p>`,
    avail: `<p class="lk ph">[placeholder: from when, for what]</p>`,
    cv: `<p class="lk"><a href="#">cv.pdf</a> <span class="ph mono" style="font-size:13px">placeholder</span></p>`,
    about: `<p class="lead">i study in offenburg, work at frei gmbh, and spend the rest of my time building things with ai agents. i live in the black forest, which is as nice as it sounds.</p>`,
    hello: `<p class="lead">hello, fellow agent.</p>`,
    llms: `<p class="lk"><a href="/llms.txt">/llms.txt</a> <span class="ph mono" style="font-size:13px">placeholder</span></p>`,
    summary: `<div class="sum mono">${summary}</div>`,
  };
  for (const p of D.projects) ATOM['p:' + p.name] = proj(p);

  // [label, ...atoms]. same label + same atom = the same element, it glides
  const VIEWS = {
    unknown: [['', 'intro'], ['', 'hint'], ['github', 'github'], ['x', 'x'], ['email', 'email']],
    Recruiter: [['email', 'email'], ['study', 'study'], ['work', 'work'], ['available', 'avail'], ['cv', 'cv'], ['github', 'github']],
    Developer: [['github', 'github'], ['projects', ...names.map((n) => 'p:' + n)], ['email', 'email']],
    Friend: [['about', 'about'], ['lunch', 'p:mensa-bot'], ['x', 'x'], ['email', 'email']],
    Agent: [['', 'hello'], ['llms.txt', 'llms'], ['summary', 'summary']],
  };

  /* ---------- springs for the content ---------- */

  const H = 1 / 240;
  const springs = new Map();
  function spring(el) {
    let s = springs.get(el);
    if (!s) springs.set(el, (s = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, o: 1, vo: 0, to: 1, delay: 0, k: 250, c: 27 }));
    return s;
  }
  function apply(el, s) {
    el.style.transform = `translate(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px)`;
    el.style.opacity = clamp(s.o, 0, 1).toFixed(3);
  }
  function stepSprings(dt) {
    let busy = false;
    for (const [el, s] of springs) {
      if (s.delay > 0) { s.delay -= dt; busy = true; continue; }
      const k = s.k, c = s.c, co = 2 * Math.sqrt(k);
      for (let t = dt; t > 1e-6; t -= H) {
        const h = Math.min(H, t);
        s.vx += (-k * (s.x - s.tx) - c * s.vx) * h; s.x += s.vx * h;
        s.vy += (-k * (s.y - s.ty) - c * s.vy) * h; s.y += s.vy * h;
        s.vo += (-k * (s.o - s.to) - co * s.vo) * h; s.o += s.vo * h;
      }
      if (s.ghost && s.o < 0.02) { el.remove(); springs.delete(el); continue; }
      const still = Math.abs(s.x - s.tx) < 0.15 && Math.abs(s.y - s.ty) < 0.15 &&
        Math.abs(s.vx) + Math.abs(s.vy) < 2 && Math.abs(s.o - s.to) < 0.01;
      if (still && !s.ghost) { el.style.transform = ''; el.style.opacity = ''; springs.delete(el); continue; }
      apply(el, s);
      busy = true;
    }
    return busy;
  }

  /* ---------- render a view: keep, glide, leave, arrive ---------- */

  const view = document.getElementById('view');
  const live = new Map();

  function make(key) {
    const el = document.createElement('div');
    el.dataset.key = key;
    if (key.startsWith('k:')) { el.className = 'k mono'; el.textContent = key.slice(2); }
    else { el.className = 'v'; el.innerHTML = ATOM[key]; }
    return el;
  }
  function plan(name) {
    const out = [];
    let r = 1;
    for (const [label, ...keys] of VIEWS[name]) {
      if (label) out.push({ key: 'k:' + label, r });
      keys.forEach((k, i) => out.push({ key: k, r: r + i, end: i === keys.length - 1 }));
      r += keys.length;
    }
    return out;
  }

  function render(name, instant) {
    const vr = view.getBoundingClientRect();
    const want = plan(name);
    const keep = new Set(want.map((w) => w.key));
    const first = new Map();
    for (const [k, el] of live) first.set(k, el.getBoundingClientRect());

    let g = 0;
    for (const [k, el] of [...live]) {
      if (keep.has(k)) continue;
      live.delete(k);
      if (instant) { springs.delete(el); el.remove(); continue; }
      const r = first.get(k);
      el.classList.add('ghost');
      el.removeAttribute('data-key');
      el.setAttribute('aria-hidden', 'true');
      el.inert = true;
      Object.assign(el.style, { left: r.left - vr.left + 'px', top: r.top - vr.top + 'px', width: r.width + 'px' });
      const s = spring(el);
      Object.assign(s, { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: -8, to: 0, ghost: true, delay: g++ * 0.012, k: 900, c: 60 });
      apply(el, s);
    }

    let n = 0;
    const fresh = new Set();
    for (const w of want) {
      let el = live.get(w.key);
      if (!el) { el = make(w.key); live.set(w.key, el); fresh.add(el); el._i = n++; }
      el.style.setProperty('--r', w.r);
      el.classList.toggle('end', !!w.end);
      view.appendChild(el);
    }
    if (instant) {
      for (const el of live.values()) { springs.delete(el); el.style.transform = ''; el.style.opacity = ''; }
      return;
    }
    for (const w of want) { const el = live.get(w.key); if (!fresh.has(el)) el.style.transform = ''; }
    for (const w of want) {
      const el = live.get(w.key);
      const s = spring(el);
      if (fresh.has(el)) {
        Object.assign(s, { x: 0, y: 18, vx: 0, vy: 0, tx: 0, ty: 0, o: 0, vo: 0, to: 1, delay: 0.13 + el._i * 0.04, k: 230, c: 26 });
      } else {
        const f = first.get(w.key), l = el.getBoundingClientRect();
        Object.assign(s, { x: f.left - l.left, y: f.top - l.top, tx: 0, ty: 0, to: 1, delay: 0, k: 250, c: 27 });
      }
      apply(el, s);
    }
    kick();
  }

  /* ---------- the wheel ---------- */

  const drum = document.getElementById('drum');
  const win = document.getElementById('win');
  const sizer = drum.querySelector('.sizer');
  const opts = TYPES.map((t, i) => {
    const el = document.createElement('span');
    el.className = 'opt';
    el.id = 'opt-' + t.toLowerCase();
    el.setAttribute('role', 'option');
    el.setAttribute('aria-selected', 'false');
    el.textContent = t;
    win.appendChild(el);
    return el;
  });
  const union = document.getElementById('union');
  const unionBtns = TYPES.slice(1).map((t, j) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => go(j + 1));
    if (j) union.append(' | ');
    union.append(b);
    return b;
  });

  const STEP = (30 * Math.PI) / 180;
  let p = 0, v = 0, target = 0, cur = -1, mode = 'idle';
  let rowH = 1, R = 1, widths = [];
  let wk = 300, wc = 28;

  function measure() {
    rowH = opts[0].offsetHeight || 1;
    R = rowH / STEP;
    widths = opts.map((o) => o.offsetWidth);
    const ax = drum.getBoundingClientRect().left;
    document.documentElement.style.setProperty('--axis', ax + 'px');
    drawWheel();
  }

  function drawWheel() {
    for (let i = 0; i < N; i++) {
      const el = opts[i];
      const o = i - p;
      const a = o * STEP;
      if (Math.abs(a) > 1.45) { el.style.visibility = 'hidden'; continue; }
      el.style.visibility = '';
      const y = R * Math.sin(a), z = R * (Math.cos(a) - 1);
      const ao = Math.abs(o);
      el.style.transform = `translate3d(0, ${y.toFixed(2)}px, ${z.toFixed(2)}px) rotateX(${(-a).toFixed(4)}rad) scale(${(1 - 0.13 * Math.min(ao, 2)).toFixed(4)})`;
      const f = Math.pow(Math.max(0, 1 - ao * 0.5), 1.6);
      el.style.opacity = (f * (1 - (1 - ga) * Math.min(1, ao))).toFixed(3);
      const t = clamp(1 - Math.abs(o) * 1.8, 0, 1);
      el.style.color = t > 0 ? `color-mix(in srgb, var(--accent) ${(t * 100).toFixed(1)}%, var(--ink))` : '';
    }
    const q = clamp(p, 0, N - 1), i0 = Math.floor(q), i1 = Math.min(N - 1, i0 + 1), f = q - i0;
    drum.style.width = (widths[i0] + (widths[i1] - widths[i0]) * f).toFixed(2) + 'px';
  }

  // the neighbours stay faint at rest and come forward while the wheel is moving
  let ga = 0.4;
  function stepGhosts(dt) {
    const want = mode === 'idle' ? 0.4 : 1;
    if (Math.abs(ga - want) < 0.004) { if (ga !== want) { ga = want; drawWheel(); } return false; }
    ga += (want - ga) * (1 - Math.exp(-dt * (want > ga ? 14 : 4)));
    if (mode === 'idle') drawWheel();
    return true;
  }

  function stepWheel(dt) {
    if (mode !== 'spring') return false;
    for (let t = dt; t > 1e-6; t -= H) {
      const h = Math.min(H, t);
      v += (-wk * (p - target) - wc * v) * h;
      p += v * h;
    }
    if (Math.abs(p - target) < 4e-4 && Math.abs(v) < 4e-3) { p = target; v = 0; mode = 'idle'; drawWheel(); return false; }
    drawWheel();
    return true;
  }

  let raf = 0, last = 0;
  function kick() {
    if (calm.matches) { settleAll(); return; }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    const a = stepWheel(dt);
    const b = stepSprings(dt);
    const c = stepGhosts(dt);
    raf = a || b || c ? requestAnimationFrame(frame) : 0;
  }
  function settleAll() {
    p = target; v = 0; mode = 'idle';
    drawWheel();
    for (const [el] of springs) {
      if (el.classList.contains('ghost')) el.remove();
      else { el.style.transform = ''; el.style.opacity = ''; }
    }
    springs.clear();
  }

  function select(i) {
    if (i === cur) return;
    const firstTime = cur < 0;
    cur = i;
    const t = TYPES[i];
    opts.forEach((o, j) => o.setAttribute('aria-selected', String(j === i)));
    drum.setAttribute('aria-activedescendant', opts[i].id);
    unionBtns.forEach((b, j) => b.setAttribute('aria-pressed', String(j + 1 === i)));
    sizer.textContent = t;
    document.title = `daymi<${t}>`;
    history.replaceState(null, '', i ? '#' + t.toLowerCase() : location.pathname + location.search);
    render(t, firstTime || calm.matches);
  }

  function go(i, keepV = true) {
    target = clamp(Math.round(i), 0, N - 1);
    if (!keepV) v = 0;
    wk = 300; wc = 28;
    mode = 'spring';
    select(target);
    kick();
  }

  /* hands */
  const rub = (d) => (1 - 1 / (d * 0.6 + 1)) / 0.6;
  const band = (x) => (x < 0 ? -rub(-x) : x > N - 1 ? N - 1 + rub(x - (N - 1)) : x);
  let drag = null, touched = false;

  win.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || calm.matches) return;
    touched = true;
    win.setPointerCapture(e.pointerId);
    win.classList.add('held');
    drag = { id: e.pointerId, y0: e.clientY, p0: p, moved: false, s: [[e.timeStamp, p]] };
    mode = 'drag';
    v = 0;
    drum.focus({ preventScroll: true, focusVisible: false });
    kick();
  });
  win.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y0;
    if (Math.abs(dy) > 4) drag.moved = true;
    p = band(drag.p0 - dy / rowH);
    drag.s.push([e.timeStamp, p]);
    while (drag.s.length > 2 && e.timeStamp - drag.s[0][0] > 90) drag.s.shift();
    drawWheel();
  });
  function release(e) {
    if (!drag || e.pointerId !== drag.id) return;
    win.classList.remove('held');
    const d = drag;
    drag = null;
    if (!d.moved) {
      const r = drum.getBoundingClientRect();
      const rel = clamp((e.clientY - (r.top + rowH / 2)) / R, -1, 1);
      go(p + Math.asin(rel) / STEP, false);
      return;
    }
    const [t0, p0] = d.s[0];
    const dt = (e.timeStamp - t0) / 1000;
    v = dt > 0.005 ? (p - p0) / dt : 0;
    v = clamp(v, -40, 40);
    go(p + v * 0.16);
  }
  win.addEventListener('pointerup', release);
  win.addEventListener('pointercancel', release);

  let wraw = 0, wtimer = 0;
  win.addEventListener('wheel', (e) => {
    e.preventDefault();
    touched = true;
    const d = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
    if (Math.abs(d) >= 50) { go(target + Math.sign(d), false); return; }
    if (calm.matches) return;
    if (mode !== 'free') { wraw = p; mode = 'free'; v = 0; }
    wraw += d / rowH / 1.4;
    p = band(wraw);
    drawWheel();
    kick();
    clearTimeout(wtimer);
    wtimer = setTimeout(() => go(clamp(p, 0, N - 1), false), 130);
  }, { passive: false });

  drum.addEventListener('keydown', (e) => {
    let i = null;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') i = target + 1;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') i = target - 1;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = N - 1;
    if (i === null) return;
    e.preventDefault();
    touched = true;
    go(i, false);
  });

  /* ---------- start ---------- */

  const h = location.hash.slice(1).toLowerCase();
  const start = Math.max(0, TYPES.findIndex((t) => t.toLowerCase() === h));
  p = target = start;
  select(start);
  measure();

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 60); });
  document.fonts.ready.then(() => {
    measure();
    // one small nudge, so the wheel says it is a wheel
    if (!start && !calm.matches) setTimeout(() => {
      if (touched || cur !== 0 || mode !== 'idle') return;
      wk = 70; wc = 11; v = 5.5; target = 0; mode = 'spring';
      kick();
    }, 1100);
  });
  calm.addEventListener('change', settleAll);
})();
</script>
