<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daymi · spec</title>
<style>
@font-face { font-family: "Schibsted Grotesk"; src: url("../fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 900; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url("../fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }

:root {
  --paper: #fbfbfa;
  --ink: #161616;
  --grey: #8a8a8a;
  --spec: #ff4a1c;
  --cols: 12;
  --gutter: 24px;
  --margin: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/24px "Schibsted Grotesk", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { margin: 0; position: relative; overflow-x: hidden; }
h1, h2, h3, p, ol, ul { margin: 0; padding: 0; font: inherit; }
ol, ul { list-style: none; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
::selection { background: var(--ink); color: var(--paper); }

/* ---------- the page: 12 columns, 8px rhythm, every gap a token ---------- */

main { max-width: 1440px; margin: 0 auto; padding: 0 var(--margin) 48px; }
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  column-gap: var(--gutter);
}

.bar { padding-top: 32px; }
.who { grid-column: 1 / 7; font-size: 14px; color: var(--grey); }
.ctl { grid-column: 7 / 13; display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 14px; color: var(--grey); }
.ctl kbd { font: inherit; color: var(--ink); }
#sw {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0; padding: 0; border: 0; background: none;
  font: inherit; color: var(--ink); cursor: pointer;
}
#sw .trk {
  position: relative; width: 28px; height: 16px; border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--ink);
  transition: background-color .2s, box-shadow .2s;
}
#sw .knob {
  position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--ink);
  transition: transform .34s cubic-bezier(.3, 1.7, .45, 1), background-color .2s;
}
#sw[aria-checked="true"] .trk { background: var(--spec); box-shadow: inset 0 0 0 1px var(--spec); }
#sw[aria-checked="true"] .knob { transform: translateX(12px); background: #fff; }

.hero { margin-top: 128px; }
.mark {
  grid-column: 1 / 9;
  font-size: 300px;
  line-height: 240px;
  font-weight: 800;
  letter-spacing: -0.045em;
  white-space: nowrap;
}
.mark span { display: inline-block; }
.probe { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
.bio {
  grid-column: 9 / 13;
  display: flex;
  align-items: flex-end;
  font-size: 32px;
  line-height: 40px;
  letter-spacing: -0.014em;
}
.bio span { display: block; max-width: 11em; }

.sec { margin-top: 96px; }
.sec.first { margin-top: 128px; }
.lab { grid-column: 1 / 4; font-size: 14px; font-weight: 500; color: var(--grey); }

.rows { grid-column: 4 / 13; display: grid; grid-template-columns: subgrid; row-gap: 32px; }
.row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: start;
  padding-top: 16px;
  box-shadow: inset 0 1px 0 var(--ink);
}
.nm { grid-column: 1 / 4; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.012em; }
/* 6 + 2 keeps the first baselines level and every height on the 8px rhythm */
.bl { grid-column: 4 / 9; padding: 6px 0 2px; max-width: 34em; }
.yr { grid-column: 9 / 10; padding: 6px 0 2px; text-align: right; color: var(--grey); font-variant-numeric: tabular-nums; }

.about { grid-column: 4 / 13; font-size: 20px; line-height: 32px; }
.about span { display: block; max-width: 32em; }
.bl, .about span { text-wrap: pretty; }

.links { grid-column: 4 / 13; display: flex; flex-wrap: wrap; column-gap: 32px; font-size: 24px; line-height: 32px; font-weight: 500; }
.links a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.links a:hover { text-decoration-thickness: 2px; }

.foot { margin-top: 128px; font-size: 14px; color: var(--grey); }
.foot p:first-child { grid-column: 1 / 7; }
.foot p:last-child { grid-column: 7 / 13; text-align: right; }

/* 8 columns */
@media (max-width: 1023px) {
  :root { --cols: 8; --margin: 32px; }
  .who { grid-column: 1 / 5; }
  .ctl { grid-column: 5 / 9; }
  .hero { row-gap: 24px; }
  .mark { grid-column: 1 / -1; }
  .bio { grid-column: 1 / -1; }
  .lab { grid-column: 1 / 3; }
  .rows { grid-column: 3 / 9; }
  .nm { grid-column: 1 / 3; }
  .bl { grid-column: 3 / 6; }
  .yr { grid-column: 6 / 7; }
  .about { grid-column: 3 / 9; }
  .links { grid-column: 3 / 9; }
  .foot p:first-child { grid-column: 1 / 6; }
  .foot p:last-child { grid-column: 6 / 9; }
}

/* 4 columns */
@media (max-width: 639px) {
  :root { --cols: 4; --gutter: 16px; --margin: 24px; }
  .who { grid-column: 1 / 3; }
  .ctl { grid-column: 3 / 5; }
  .hero { margin-top: 96px; }
  .bio { grid-column: 1 / -1; font-size: 24px; line-height: 32px; }
  .sec, .sec.first { margin-top: 96px; row-gap: 16px; }
  .lab, .rows, .about, .links { grid-column: 1 / -1; }
  .row { row-gap: 8px; }
  .nm { grid-column: 1 / 4; }
  .yr { grid-column: 4 / 5; }
  .bl { grid-column: 1 / -1; grid-row: 2; padding: 0; }
  .about { font-size: 20px; line-height: 32px; }
  .links { column-gap: 24px; font-size: 20px; }
  .foot { margin-top: 96px; row-gap: 8px; }
  .foot p:first-child, .foot p:last-child { grid-column: 1 / -1; text-align: left; }
}
@media (hover: none) { .hint { display: none; } }

/* ---------- the spec overlay ---------- */

#spec { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; overflow: hidden; z-index: 5; }
#spec svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
#spec .ol { fill: none; stroke: var(--spec); stroke-width: 1; shape-rendering: crispEdges; }
#spec .ol.dash { stroke-dasharray: 2 3; }
#spec .ln { stroke: var(--spec); stroke-width: 1; shape-rendering: crispEdges; }
#spec .col { fill: var(--spec); fill-opacity: .055; }
#spec .base {
  position: absolute; left: 0; top: 0; width: 100%;
  background: repeating-linear-gradient(to bottom, transparent 0 7px, rgba(255, 74, 28, .13) 7px 8px);
}
.tag {
  position: absolute; left: 0; top: 0;
  padding: 0 5px;
  border-radius: 2px;
  background: var(--spec);
  color: #fff;
  font: 500 11px/17px "JetBrains Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  white-space: nowrap;
  transform-origin: 50% 50%;
  will-change: transform, opacity;
}
.tag i { font-style: normal; opacity: .72; }
.tag.off { background: var(--ink); }
.tag.rot { padding: 0 6px; }
.tag.size { background: var(--paper); color: var(--spec); box-shadow: inset 0 0 0 1px var(--spec); }

#chip {
  position: absolute; left: 0; top: 0;
  padding: 0 6px;
  border-radius: 2px;
  background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--spec);
  font: 400 11px/17px "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: -.01em;
  color: var(--ink);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
}
#chip.on { opacity: 1; }
/* phones: the type spec lives in a bar at the bottom instead of next to the frame */
#chip.bar { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px; padding: 6px 8px; line-height: 16px; white-space: normal; transform: none !important; }
#chip b { font-weight: 600; color: var(--spec); }
#chip em { font-style: normal; color: var(--spec); }

@media (prefers-reduced-motion: reduce) {
  #sw .knob, #sw .trk, #chip { transition: none; }
}
</style>
</head>
<body>
<main id="page">
  <header class="bar grid">
    <p class="who" data-spec="label">daniel kistner</p>
    <div class="ctl" data-spec="control">
      <span class="hint" aria-hidden="true">hold <kbd>alt</kbd> or</span>
      <button id="sw" type="button" role="switch" aria-checked="false" aria-label="show the spec: every measurement on the page"><span>spec</span><span class="trk"><span class="knob"></span></span></button>
    </div>
  </header>

  <section class="hero grid">
    <h1 class="mark" data-spec="wordmark" data-chip="below"><span>daymi</span><i class="probe"></i></h1>
    <p class="bio" data-spec="bio"><span>building stuff, i guess.<i class="probe"></i></span></p>
  </section>

  <section class="sec first grid" aria-labelledby="h-p">
    <h2 class="lab" id="h-p" data-spec="section label">projects</h2>
    <ol class="rows" id="rows"></ol>
  </section>

  <section class="sec grid" aria-labelledby="h-a">
    <h2 class="lab" id="h-a" data-spec="section label">about</h2>
    <p class="about" data-spec="about" id="about"></p>
  </section>

  <section class="sec grid" aria-labelledby="h-e">
    <h2 class="lab" id="h-e" data-spec="section label">elsewhere</h2>
    <ul class="links" id="links" data-spec="links" data-parts></ul>
  </section>

  <footer class="foot grid">
    <p data-spec="note">every distance on this page is a token from one scale. <span class="hint">hold alt, or </span>flip the switch to check my work.</p>
    <p data-spec="note">© 2026 daniel kistner</p>
  </footer>
</main>

<div id="spec" aria-hidden="true"><svg></svg><div id="chip"></div></div>

<script src="data.js"></script>
<script>
(() => {
  const D = window.DATA;
  const $ = (s, r = document) => r.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---------- content ----------
  $('#rows').innerHTML = D.projects.map((p) =>
    `<li class="row" data-spec="project row" data-parts>` +
    `<h3 class="nm"><a href="${p.url}">${p.name}</a></h3>` +
    `<p class="bl">${p.blurb}</p>` +
    `<p class="yr">${p.year}</p></li>`).join('');
  $('#links').innerHTML = D.links.map((l) => `<li><a href="${l.href}">${l.label}</a></li>`).join('');
  $('#about').innerHTML = '<span>' +
    `i'm daniel. i study ${D.study} and work at frei gmbh as a working student. ` +
    `the rest of the time i build things with ai agents, and things for them.</span>`;

  const page = $('#page'), mark = $('.mark'), bio = $('.bio');
  const layer = $('#spec'), svg = $('#spec svg'), chip = $('#chip'), sw = $('#sw');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const NS = 'http://www.w3.org/2000/svg';
  const TOK = [4, 8, 12, 16, 24, 32, 48, 64, 96, 128];
  const blocks = () => [...document.querySelectorAll('[data-spec]')];
  blocks().forEach((b, i) => (b.dataset.id = i));

  // ---------- layout helpers ----------

  // the wordmark fills its columns exactly; line height snaps to the 8px rhythm
  function fit() {
    const span = mark.firstElementChild;
    mark.style.fontSize = '100px';
    const k = mark.clientWidth / span.getBoundingClientRect().width;
    const fs = Math.floor(100 * k);
    mark.style.fontSize = fs + 'px';
    mark.style.lineHeight = Math.round(fs * 0.8 / 8) * 8 + 'px';
    // the bio's last baseline sits on the wordmark's baseline
    bio.style.paddingBottom = '0px';
    const side = getComputedStyle(bio).gridRowStart === getComputedStyle(mark).gridRowStart &&
      Math.abs(bio.getBoundingClientRect().top - mark.getBoundingClientRect().top) < 2;
    if (side) {
      const mb = mark.querySelector('.probe').getBoundingClientRect().top;
      const bb = bio.querySelector('.probe').getBoundingClientRect().top;
      bio.style.paddingBottom = Math.max(0, Math.round(bb - mb)) + 'px';
    }
  }

  const rect = (el) => {
    const r = el.getBoundingClientRect();
    return { l: r.left + scrollX, t: r.top + scrollY, r: r.right + scrollX, b: r.bottom + scrollY };
  };
  const token = (v) => { const i = TOK.indexOf(v); return i < 0 ? null : 'space-' + (i + 1); };

  // nearest neighbour in each direction, or the frame edge when there is none
  function gaps(a, cands, frame, dirs) {
    const out = [];
    for (const d of dirs) {
      const vert = d === 'up' || d === 'down';
      let best = null, bd = Infinity;
      for (const r of cands) {
        const lo = vert ? Math.max(a.l, r.l) : Math.max(a.t, r.t);
        const hi = vert ? Math.min(a.r, r.r) : Math.min(a.b, r.b);
        if (hi - lo < 1) continue;
        const dist = d === 'up' ? a.t - r.b : d === 'down' ? r.t - a.b : d === 'left' ? a.l - r.r : r.l - a.r;
        if (dist < -0.5 || dist >= bd) continue;
        bd = dist; best = { lo, hi };
      }
      if (!best) {
        if (!frame) continue;
        bd = d === 'up' ? a.t - frame.t : d === 'down' ? frame.b - a.b : d === 'left' ? a.l - frame.l : frame.r - a.r;
        best = vert ? { lo: a.l, hi: a.r } : { lo: a.t, hi: a.b };
      }
      const v = Math.round(bd);
      if (v < 1) continue;
      const m = (best.lo + best.hi) / 2;
      const s = d === 'up' ? { x1: m, y1: a.t, x2: m, y2: a.t - bd }
        : d === 'down' ? { x1: m, y1: a.b, x2: m, y2: a.b + bd }
        : d === 'left' ? { x1: a.l, y1: m, x2: a.l - bd, y2: m }
        : { x1: a.r, y1: m, x2: a.r + bd, y2: m };
      s.v = v; s.vert = vert; s.span = best.hi - best.lo;
      out.push(s);
    }
    return out;
  }
  const segKey = (s) => {
    const r = Math.round;
    const p = [r(s.x1), r(s.y1)], q = [r(s.x2), r(s.y2)];
    return (p[0] + p[1] < q[0] + q[1] ? [p, q] : [q, p]).join('|');
  };

  // ---------- geometry for each kind of overlay ----------

  function hoverGeo(el) {
    const a = rect(el), frame = rect(page);
    const cands = blocks().filter((b) => b !== el && !b.contains(el) && !el.contains(b)).map(rect);
    const g = { rects: [{ r: a, a: 1 }], segs: gaps(a, cands, frame, ['up', 'down', 'left', 'right']), badges: [] };
    if (el.hasAttribute('data-parts')) {
      const pr = [...el.children].map(rect);
      pr.forEach((r, i) => {
        g.rects.push({ r, a: 0.55, dash: true });
        g.segs.push(...gaps(r, pr.filter((_, j) => j !== i), null, ['right', 'down']).map((s) => ((s.part = true), s)));
      });
    }
    if (innerWidth >= 640) g.badges.push({ x: a.l, y: a.b + 6, text: `${Math.round(a.r - a.l)} × ${Math.round(a.b - a.t)}` });
    return g;
  }

  function fullGeo() {
    const all = blocks(), frame = rect(page), seen = new Set(), per = [];
    const rs = all.map(rect);
    all.forEach((el, i) => {
      const a = rs[i];
      const cands = rs.filter((_, j) => j !== i && !all[j].contains(el) && !el.contains(all[j]));
      const segs = gaps(a, cands, frame, ['up', 'down', 'left', 'right']).filter((s) => {
        const k = segKey(s);
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      per.push({ key: 'f:' + el.dataset.id, top: a.t, geo: { rects: [{ r: a, a: 0.7 }], segs, badges: [] } });
    });
    return per;
  }

  function gridGeo() {
    const host = $('.hero'), cs = getComputedStyle(host), h = rect(host), frame = rect(page);
    const tracks = cs.gridTemplateColumns.split(' ').map(parseFloat);
    const gap = parseFloat(cs.columnGap) || 0;
    const cols = [];
    let x = h.l;
    for (const w of tracks) { cols.push({ l: x, r: x + w }); x += w + gap; }
    return { cols, top: frame.t, bottom: document.documentElement.scrollHeight, baseline: true };
  }

  // ---------- drawing ----------

  const mk = (tag, cls, parent) => {
    const el = document.createElementNS(NS, tag);
    if (cls) el.setAttribute('class', cls);
    parent.appendChild(el);
    return el;
  };
  const label = (v) => {
    const t = token(v);
    return t ? `${v}<i> · ${t}</i>` : `${v}`;
  };

  function mount(g) {
    const geo = g.geo, root = mk('g', null, svg), n = { root, rects: [], lines: [], tags: [], cols: [], base: null };
    const R = Math.round;
    for (const o of geo.rects || []) {
      const el = mk('rect', o.dash ? 'ol dash' : 'ol', root);
      el.setAttribute('x', R(o.r.l) + 0.5);
      el.setAttribute('y', R(o.r.t) + 0.5);
      el.setAttribute('width', Math.max(0, R(o.r.r) - R(o.r.l) - 1));
      el.setAttribute('height', Math.max(0, R(o.r.b) - R(o.r.t) - 1));
      n.rects.push({ el, a: o.a });
    }
    for (const s of geo.segs || []) {
      // vertical lines sit on half pixels in x, horizontal ones in y: always 1px crisp
      const x1 = s.vert ? R(s.x1) + 0.5 : R(s.x1), y1 = s.vert ? R(s.y1) : R(s.y1) + 0.5;
      const x2 = s.vert ? x1 : R(s.x2), y2 = s.vert ? R(s.y2) : y1;
      const line = mk('line', 'ln', root), c1 = mk('line', 'ln', root), c2 = mk('line', 'ln', root);
      const tag = document.createElement('div');
      tag.className = token(s.v) ? 'tag' : 'tag off';
      tag.innerHTML = label(s.v);
      layer.appendChild(tag);
      n.lines.push({ s, x1, y1, x2, y2, line, c1, c2, tag, w: 0, h: 0 });
    }
    for (const b of geo.badges || []) {
      const tag = document.createElement('div');
      tag.className = 'tag size';
      tag.textContent = b.text;
      layer.appendChild(tag);
      n.tags.push({ el: tag, x: b.x, y: b.y });
    }
    for (const c of geo.cols || []) {
      const el = mk('rect', 'col', root);
      el.setAttribute('x', R(c.l));
      el.setAttribute('width', R(c.r) - R(c.l));
      el.setAttribute('y', geo.top);
      el.setAttribute('height', geo.bottom - geo.top);
      n.cols.push(el);
    }
    if (geo.baseline) {
      n.base = document.createElement('div');
      n.base.className = 'base';
      n.base.style.height = geo.bottom + 'px';
      layer.insertBefore(n.base, layer.firstChild);
    }
    // measure tags once so they can be kept inside the page
    const W = document.documentElement.clientWidth;
    for (const l of n.lines) {
      l.w = l.tag.offsetWidth; l.h = l.tag.offsetHeight;
      const mx = (l.x1 + l.x2) / 2, my = (l.y1 + l.y2) / 2, len = l.s.v;
      l.rot = '';
      if (!l.s.vert && l.w > len - 8) {
        // a gutter is narrower than its label: stand the label up inside the gap
        l.rot = ' rotate(-90deg)';
        l.tag.classList.add('rot');
        // inside a row there is no room for the token name: the number alone
        if (l.s.part && l.w > l.s.span + 2) { l.tag.textContent = l.s.v; l.w = l.tag.offsetWidth; }
        l.tx = mx - l.w / 2; l.ty = my - l.h / 2;
      } else if (l.s.vert && l.h > len - 4) {
        if (l.s.part) { l.tag.textContent = l.s.v; l.w = l.tag.offsetWidth; }
        l.tx = clamp(mx + 6, 2, W - l.w - 2); l.ty = my - l.h / 2;
      } else {
        l.tx = clamp(mx - l.w / 2, 2, W - l.w - 2); l.ty = my - l.h / 2;
      }
    }
    for (const t of n.tags) t.x = clamp(t.x, 2, W - t.el.offsetWidth - 2);
    g.n = n;
  }

  function unmount(g) {
    if (!g.n) return;
    g.n.root.remove();
    g.n.lines.forEach((l) => l.tag.remove());
    g.n.tags.forEach((t) => t.el.remove());
    if (g.n.base) g.n.base.remove();
    g.n = null;
  }

  // one spring value per group; everything it draws is a function of it.
  // outline first, then the lines grow out of the element, then the numbers pop in.
  function paint(g) {
    const p = g.s, n = g.n;
    const oa = clamp(p * 2.5, 0, 1);
    const lp = clamp((p - 0.12) / 0.7, 0, 1);
    const la = clamp((p - 0.5) / 0.3, 0, 1);
    const ls = 0.7 + 0.3 * Math.max(0, p);
    for (const r of n.rects) r.el.style.opacity = oa * r.a;
    for (const l of n.lines) {
      const x = l.x1 + (l.x2 - l.x1) * lp, y = l.y1 + (l.y2 - l.y1) * lp;
      l.line.setAttribute('x1', l.x1); l.line.setAttribute('y1', l.y1);
      l.line.setAttribute('x2', x); l.line.setAttribute('y2', y);
      l.line.style.opacity = oa;
      const cap = (el, cx, cy, a) => {
        if (l.s.vert) { el.setAttribute('x1', cx - 3.5); el.setAttribute('x2', cx + 3.5); el.setAttribute('y1', cy); el.setAttribute('y2', cy); }
        else { el.setAttribute('y1', cy - 3.5); el.setAttribute('y2', cy + 3.5); el.setAttribute('x1', cx); el.setAttribute('x2', cx); }
        el.style.opacity = a;
      };
      cap(l.c1, l.x1, l.y1, oa);
      cap(l.c2, x, y, lp > 0.02 ? oa : 0);
      l.tag.style.opacity = la;
      l.tag.style.transform = `translate(${l.tx}px, ${l.ty}px)${l.rot} scale(${ls})`;
    }
    for (const t of n.tags) {
      t.el.style.opacity = la;
      t.el.style.transform = `translate(${t.x}px, ${t.y}px) scale(${ls})`;
    }
    for (const c of n.cols) c.style.opacity = oa;
    if (n.base) n.base.style.opacity = oa;
  }

  // ---------- state ----------

  const groups = new Map();
  let hovered = null, alt = false, intro = false, running = false, last = 0;

  function want() {
    const w = new Map();
    const full = alt || sw.getAttribute('aria-checked') === 'true';
    const hov = (el) => w.set('h:' + el.dataset.id, { make: () => hoverGeo(el), delay: 0 });
    if (intro) { hov(mark); hov(bio); }
    if (hovered) hov(hovered);
    if (full) {
      w.set('grid', { make: gridGeo, delay: 0 });
      const vy = scrollY;
      for (const f of fullGeo()) {
        const geo = f.geo;
        w.set(f.key, { make: () => fullGeo().find((x) => x.key === f.key).geo, geo, delay: clamp((f.top - vy) * 0.35, 0, 420) });
      }
    }
    return w;
  }

  function sync() {
    const w = want(), now = performance.now();
    for (const [key, spec] of w) {
      let g = groups.get(key);
      if (!g) {
        g = { key, make: spec.make, s: 0, v: 0, want: 1, at: now + spec.delay };
        g.geo = spec.geo || spec.make();
        mount(g);
        groups.set(key, g);
      } else if (!g.want) {
        g.want = 1; g.at = now;
      }
    }
    for (const [key, g] of groups) if (!w.has(key) && g.want) { g.want = 0; g.at = now; }
    if (calm.matches) {
      for (const [key, g] of groups) {
        g.s = g.want; g.v = 0;
        if (!g.want) { unmount(g); groups.delete(key); } else paint(g);
      }
      return;
    }
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }

  // a slightly underdamped spring: quick, with a small settle
  const K = 560, C = 2 * Math.sqrt(K) * 0.62;
  function tick(now) {
    const dt = Math.min(0.032, (now - last) / 1000);
    last = now;
    let live = false;
    for (const [key, g] of groups) {
      const t = now >= g.at ? g.want : 0;
      const sub = 4, h = dt / sub;
      for (let i = 0; i < sub; i++) { g.v += (K * (t - g.s) - C * g.v) * h; g.s += g.v * h; }
      if (Math.abs(t - g.s) < 0.002 && Math.abs(g.v) < 0.01) { g.s = t; g.v = 0; }
      else live = true;
      if (now < g.at) live = true;
      paint(g);
      if (g.s === 0 && !g.want) { unmount(g); groups.delete(key); }
    }
    if (live) requestAnimationFrame(tick);
    else running = false;
  }

  function relayout() {
    fit();
    layer.style.height = '0px';
    layer.style.height = document.documentElement.scrollHeight + 'px';
    for (const g of groups.values()) {
      unmount(g);
      g.geo = g.make();
      mount(g);
      paint(g);
    }
  }

  // ---------- the chip: type spec of whatever text is under the pointer ----------

  function swatch(c) {
    if (c === 'rgb(22, 22, 22)') return 'ink';
    if (c === 'rgb(138, 138, 138)') return 'grey';
    if (c === 'rgb(255, 74, 28)') return 'spec';
    return c;
  }
  function describe(el, block) {
    while (el && el !== block && !([...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim()))) {
      el = el.firstElementChild;
    }
    if (!el || !el.textContent.trim()) el = block;
    while (el.children.length && ![...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) el = el.firstElementChild;
    const cs = getComputedStyle(el);
    const tag = (el.closest('h1, h2, h3, p, li') || el).tagName.toLowerCase();
    const fam = cs.fontFamily.split(',')[0].replace(/["']/g, '').toLowerCase();
    const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
    const ls = parseFloat(cs.letterSpacing);
    const track = Number.isFinite(ls) && Math.abs(ls) > 0.01 ? ` · ${(ls / fs).toFixed(3).replace('-0.', '−.')}em` : '';
    return `<b>${tag}</b> · ${fam} <em>${cs.fontWeight}</em> · ` +
      `<em>${Math.round(fs)}</em>/<em>${Math.round(lh)}</em>${track} · ${swatch(cs.color)}`;
  }
  // one line, sitting on the hovered frame's top right corner, in the gap above it
  let chipFor = null;
  function showChip(target, block) {
    if (!block) { chip.classList.remove('on'); chipFor = null; return; }
    const bar = innerWidth < 640;
    if (chipFor !== target || chip.classList.contains('bar') !== bar) {
      const r = rect(block);
      chip.classList.toggle('bar', bar);
      chip.innerHTML = (bar ? `<b>${block.dataset.spec}</b> · ${Math.round(r.r - r.l)} × ${Math.round(r.b - r.t)}<br>` : '') + describe(target, block);
      chipFor = target;
    }
    if (bar) { chip.classList.add('on'); return; }
    const a = rect(block), W = document.documentElement.clientWidth, w = chip.offsetWidth;
    const below = block.dataset.chip === 'below';
    const x = clamp(Math.round(a.r - w), 2, W - w - 2);
    const y = below ? Math.round(a.b + 6) : Math.round(a.t - chip.offsetHeight - 6);
    chip.style.transform = `translate(${x}px, ${y}px)`;
    chip.classList.add('on');
  }

  function setHover(el) {
    if (el === hovered) return;
    hovered = el;
    if (intro && el) { intro = false; clearTimeout(introTimer); }
    sync();
  }

  // ---------- input ----------

  document.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const b = e.target.closest ? e.target.closest('[data-spec]') : null;
    setHover(b);
    showChip(e.target, b);
  });
  document.documentElement.addEventListener('mouseleave', () => { setHover(null); showChip(null, null); });
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    if (e.target.closest && e.target.closest('#sw')) return;
    const b = e.target.closest ? e.target.closest('[data-spec]') : null;
    setHover(b);
    showChip(e.target, b);
  });

  document.addEventListener('focusin', (e) => {
    const b = e.target.closest('[data-spec]');
    if (!b) return;
    setHover(b);
    showChip(e.target, b);
  });
  document.addEventListener('focusout', () => { setHover(null); showChip(null, null); });

  sw.addEventListener('click', () => {
    sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    sync();
  });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Alt') return;
    e.preventDefault();
    if (!alt) { alt = true; sync(); }
  });
  addEventListener('keyup', (e) => {
    if (e.key !== 'Alt') return;
    e.preventDefault();
    alt = false; sync();
  });
  addEventListener('blur', () => { if (alt) { alt = false; sync(); } });

  let rt = 0;
  new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(relayout, 60); }).observe(document.documentElement);

  // ---------- start: show the hero's redlines once, then put them away ----------

  let introTimer = 0;
  document.fonts.ready.then(() => {
    relayout();
    if (calm.matches || location.hash === '#quiet') return;
    setTimeout(() => {
      intro = true; sync();
      introTimer = setTimeout(() => { intro = false; sync(); }, 1700);
    }, 350);
  });

  window.spec = { sync, relayout, setHover, groups, show: (on) => { sw.setAttribute('aria-checked', on ? 'true' : 'false'); sync(); } };
})();
</script>
</body>
</html>
