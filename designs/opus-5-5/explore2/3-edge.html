<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daymi · grab the edge</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../fonts/archivo-wdth.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }

  :root {
    --surround: #dcdcd8;
    --paper: #ffffff;
    --ink: #111111;
    --grey: #777777;
    --hair: #e4e4e1;
    --teal: #0f8a6a;
    --ruler: 44px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--surround); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    overflow-x: clip;
    font: 400 16px/1.45 "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- the instrument: ruler, readout, edge ---------- */

  .ruler {
    position: sticky;
    top: 0;
    z-index: 20;
    height: var(--ruler);
    background: var(--surround);
    touch-action: none;
    cursor: ew-resize;
    user-select: none;
    -webkit-user-select: none;
  }
  .ruler svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ruler .tick { stroke: var(--grey); stroke-width: 1; shape-rendering: crispEdges; }
  .ruler .num {
    fill: var(--grey);
    font: 500 9.5px "Archivo", sans-serif;
    font-stretch: 78%;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .ruler .bp line { stroke: var(--ink); stroke-width: 1; shape-rendering: crispEdges; }
  .ruler .bp text { fill: var(--ink); font: 650 10px "Archivo", sans-serif; font-stretch: 80%; font-variant-numeric: tabular-nums; }
  .ruler .bp.on line { stroke: var(--teal); stroke-width: 2; }
  .ruler .bp.on text { fill: var(--teal); }

  .thumb {
    position: absolute;
    top: 7px;
    left: 0;
    height: 22px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 3px;
    background: var(--teal);
    color: #fff;
    border-radius: 2px;
    font: 650 12px/1 "Archivo", sans-serif;
    font-stretch: 82%;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    cursor: ew-resize;
    touch-action: none;
    will-change: transform;
  }
  .thumb::after {
    /* little pointer down at the edge */
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    background: var(--teal);
    clip-path: polygon(0 0, 100% 0, 50% 60%);
  }
  .thumb small { font-weight: 450; opacity: 0.75; font-size: 10px; }
  .thumb:focus-visible { outline-offset: 2px; }

  .hint {
    position: absolute;
    top: 13px;
    left: 0;
    font: 500 11px/1 "Archivo", sans-serif;
    font-stretch: 85%;
    color: var(--grey);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .hint.gone { opacity: 0; }

  .edge {
    position: fixed;
    top: var(--ruler);
    bottom: 0;
    left: 0;
    width: 28px;
    margin-left: -14px;
    z-index: 15;
    cursor: ew-resize;
    touch-action: none;
    display: none;
  }
  .wide .edge { display: block; }
  .edge::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 13px;
    width: 2px;
    background: var(--teal);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .edge:hover::before, .dragging .edge::before { opacity: 1; }
  .edge .grip {
    position: absolute;
    top: 50%;
    left: 9px;
    width: 10px;
    height: 56px;
    margin-top: -28px;
    background: var(--teal);
    border-radius: 2px;
  }
  .edge .grip::before, .edge .grip::after {
    content: "";
    position: absolute;
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: rgba(255, 255, 255, 0.7);
  }
  .edge .grip::before { left: 3px; }
  .edge .grip::after { right: 3px; }

  .guides { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
  .guides i {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px dashed rgba(17, 17, 17, 0.22);
  }

  .stage { position: relative; }
  .holder { position: relative; z-index: 1; }
  .dragging, .dragging * { cursor: ew-resize !important; user-select: none; }

  /* ---------- the frame. everything inside it answers to its width, not the window's ---------- */

  .frame {
    container: f / inline-size;
    position: relative;
    background: var(--paper);
    transform-origin: 0 0;
    min-height: calc(100vh - var(--ruler));
    overflow: clip;
    opacity: 0;
  }
  .ready .frame { opacity: 1; }
  [data-flip] { will-change: transform; }

  /* narrow first: an app */
  .page { padding: 0 20px 28px; }

  .navbar {
    position: sticky;
    top: var(--ruler);
    z-index: 3;
    height: 44px;
    margin-bottom: -44px;
    display: grid;
    place-items: center;
    background: var(--paper);
    font-weight: 700;
    font-stretch: 80%;
    font-size: 17px;
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--hair);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  .titled .navbar { opacity: 1; }
  .scaled .navbar { display: none; }

  .top { display: flex; justify-content: space-between; align-items: baseline; padding-top: 16px; min-height: 44px; }
  .who { font-size: 13px; color: var(--grey); }
  .links { display: none; }

  .mark {
    margin-top: 10px;
    font-weight: 800;
    line-height: 0.8;
    letter-spacing: -0.015em;
    white-space: nowrap;
    padding-bottom: 0.13em;
  }
  .probe {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    font-weight: 800;
    font-size: 200px;
    letter-spacing: -0.015em;
    left: -9999px;
    top: 0;
  }

  .intro { margin-top: 18px; }
  .bio { font-size: 21px; line-height: 1.2; font-weight: 500; letter-spacing: -0.01em; }
  .facts { margin-top: 10px; font-size: 14px; color: var(--grey); }
  .facts span { display: block; }

  .label { font-size: 13px; color: var(--grey); font-weight: 500; }
  .projects { margin-top: 44px; }
  .projects .label { margin-bottom: 6px; }
  .plist li { border-top: 1px solid var(--hair); }
  .plist li:last-child { border-bottom: 1px solid var(--hair); }
  .plist a {
    display: grid;
    grid-template-columns: 1fr auto 14px;
    column-gap: 10px;
    padding: 13px 0 14px;
    text-decoration: none;
  }
  .plist .name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .plist .year { font-size: 13px; color: var(--grey); font-variant-numeric: tabular-nums; align-self: center; }
  .plist .chev { align-self: center; color: #b4b4b0; font-size: 20px; line-height: 1; text-align: right; transform: translateY(-1px); }
  .plist .blurb { grid-column: 1 / -1; font-size: 14px; line-height: 1.4; color: var(--grey); margin-top: 3px; }
  .plist a:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  .about { margin-top: 40px; }
  .about .label { margin-bottom: 8px; }
  .about p:not(.label) { font-size: 16px; line-height: 1.5; }

  .foot { margin-top: 48px; padding-bottom: 8px; font-size: 12px; color: var(--grey); display: flex; justify-content: space-between; gap: 16px; }

  .tabbar {
    position: sticky;
    bottom: 0;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--paper);
    border-top: 1px solid var(--hair);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .scaled .tabbar { position: relative; }
  .tabbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 0 9px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
  }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

  /* two columns */
  @container f (min-width: 700px) {
    .page { padding: 0 32px 32px; }
    .navbar, .tabbar { display: none; }
    .top { padding-top: 24px; }
    .who { font-size: 14px; color: var(--ink); }
    .links { display: flex; gap: 22px; font-size: 14px; }
    .links a { text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .mark { margin-top: 36px; }
    .intro { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; align-items: start; }
    .bio { font-size: 26px; }
    .facts { margin-top: 4px; font-size: 15px; }
    .projects { margin-top: 80px; }
    .projects .label { margin-bottom: 0; padding-bottom: 14px; }
    .plist { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
    .plist li, .plist li:last-child { border-bottom: 0; border-top: 1px solid var(--ink); }
    .plist a { grid-template-columns: 1fr auto; padding: 12px 0 34px; }
    .plist .chev { display: none; }
    .plist .name { font-size: 20px; }
    .plist .blurb { font-size: 15px; color: var(--ink); max-width: 30em; margin-top: 8px; }
    .about { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; border-top: 1px solid var(--ink); padding-top: 14px; }
    .about p:not(.label) { font-size: 18px; }
    .foot { margin-top: 96px; }
  }

  /* editorial */
  @container f (min-width: 1100px) {
    .page { padding: 0 40px 36px; }
    .top { padding-top: 28px; }
    .who, .links { font-size: 15px; }
    .links { gap: 28px; }
    .mark { margin-top: 44px; }
    .intro { margin-top: 30px; grid-template-columns: repeat(12, 1fr); column-gap: 24px; }
    .intro .facts { grid-column: 1 / span 4; grid-row: 1; margin-top: 8px; }
    .intro .bio { grid-column: 7 / span 6; grid-row: 1; font-size: 36px; line-height: 1.1; font-weight: 450; letter-spacing: -0.02em; }
    .projects { margin-top: 120px; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; }
    .projects .label { grid-column: 1 / span 3; padding-top: 14px; border-top: 1px solid var(--ink); }
    .plist { grid-column: 4 / span 9; grid-template-columns: repeat(3, 1fr); column-gap: 24px; }
    .plist .name { font-size: 22px; }
    .plist .blurb { font-size: 15px; }
    .about { margin-top: 64px; grid-template-columns: repeat(12, 1fr); column-gap: 24px; border-top: 0; padding-top: 0; }
    .about .label { grid-column: 1 / span 3; padding-top: 14px; border-top: 1px solid var(--ink); margin: 0; }
    .about p:not(.label) { grid-column: 4 / span 6; font-size: 22px; line-height: 1.42; letter-spacing: -0.01em; padding-top: 10px; border-top: 1px solid var(--ink); }
    .foot { margin-top: 140px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hint, .navbar, .edge::before { transition: none; }
  }
</style>
</head>
<body>
  <div class="ruler">
    <svg aria-hidden="true"></svg>
    <span class="hint" aria-hidden="true">drag the edge</span>
    <div class="thumb" role="slider" tabindex="0" aria-label="page width"
         aria-valuemin="320" aria-valuemax="1440" aria-valuenow="375"><b class="val">375</b><small>px</small></div>
  </div>

  <div class="stage">
    <div class="guides" aria-hidden="true"></div>
    <div class="holder">
      <div class="frame">
        <div class="navbar" aria-hidden="true">daymi</div>
        <div class="page">
          <header class="top">
            <p class="who" data-flip data-key="who"></p>
            <ul class="links" aria-label="elsewhere"></ul>
          </header>
          <h1 class="mark" data-flip data-key="mark">daymi</h1>
          <div class="intro">
            <p class="bio" data-flip data-key="bio"></p>
            <p class="facts" data-flip data-key="facts"></p>
          </div>
          <section class="projects" aria-labelledby="ph">
            <h2 class="label" id="ph" data-flip data-key="ph">projects</h2>
            <ul class="plist"></ul>
          </section>
          <section class="about" aria-labelledby="ah">
            <h2 class="label" id="ah" data-flip data-key="ah">about</h2>
            <p data-flip data-key="ap"></p>
          </section>
          <footer class="foot" data-flip data-key="foot">
            <span>one page, every width.</span><span>© 2026 daniel kistner</span>
          </footer>
        </div>
        <nav class="tabbar" aria-label="elsewhere"></nav>
      </div>
    </div>
  </div>
  <span class="probe" aria-hidden="true">daymi</span>
  <div class="edge" aria-hidden="true"><span class="grip"></span></div>

<script src="data.js"></script>
<script>
(() => {
  const D = window.DATA;
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const el = (tag, props = {}, kids = []) => {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of kids) n.append(k);
    return n;
  };

  /* ---------- content ---------- */

  $('.who').textContent = D.full;
  $('.bio').textContent = D.bio;
  $('.facts').append(
    el('span', { textContent: 'applied computer science, hochschule offenburg' }),
    el('span', { textContent: 'working student, frei gmbh' }),
  );
  $('.about p:not(.label)').textContent =
    "i'm daniel. i study " + D.study + ' and work at frei gmbh as a working student. ' +
    'the rest of the time i build things with ai agents, and things for them.';

  const icons = [
    '<path d="M6 3.5h11.5v14H7.5a1.5 1.5 0 0 0-1.5 1.5zM6 19a1.5 1.5 0 0 0 1.5 1.5h10v-3"/><path d="M9.5 7.5h5"/>',
    '<path d="M4 5h16v11H10l-4.5 3.5V16H4z"/>',
    '<rect x="3.5" y="5.5" width="17" height="13"/><path d="m4 6.5 8 6.5 8-6.5"/>',
  ];
  const tabNames = ['github', 'x', 'mail'];
  D.links.forEach((l, i) => {
    const a = el('a', { href: l.href, textContent: l.label });
    $('.links').append(el('li', { className: 'l' }, [a]));
    $('.links li:last-child').dataset.flip = '';
    $('.links li:last-child').dataset.key = 'l' + i;
    const t = el('a', { href: l.href });
    t.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg><span>${tabNames[i]}</span>`;
    t.dataset.flip = '';
    t.dataset.key = 'l' + i;
    $('.tabbar').append(t);
  });
  for (const [i, p] of D.projects.entries()) {
    const a = el('a', { href: p.url }, [
      el('span', { className: 'name', textContent: p.name }),
      el('span', { className: 'year', textContent: p.year }),
      el('span', { className: 'chev', textContent: '›', ariaHidden: 'true' }),
      el('span', { className: 'blurb', textContent: p.blurb }),
    ]);
    $('.plist').append(el('li', {}, [a]));
    const li = $('.plist li:last-child');
    li.dataset.flip = '';
    li.dataset.key = 'p' + i;
  }

  /* ---------- geometry ---------- */

  const root = document.documentElement;
  const frame = $('.frame'), holder = $('.holder'), mark = $('.mark'), probe = $('.probe');
  const thumb = $('.thumb'), val = $('.val'), hint = $('.hint'), edge = $('.edge');
  const svg = $('.ruler svg'), guides = $('.guides');
  const flips = [...document.querySelectorAll('[data-flip]')];
  const calm = matchMedia('(prefers-reduced-motion: reduce)');

  const BPS = [700, 1100];
  const WMIN = 320, WCAP = 1600, WPHONE = 1440;
  const bpOf = (w) => (w >= 1100 ? 2 : w >= 700 ? 1 : 0);

  // stage: "wide" means the window can show the wide layout at 1:1, so the
  // ruler is a real ruler and the frame edge is the handle. otherwise the ruler
  // becomes a compressed scale from 320 to 1440 and the frame zooms out to fit.
  let vw, gutter, left0, wmax, wide, span;
  function stage() {
    vw = root.clientWidth;
    wide = vw >= 1100 + 48;
    gutter = wide ? 24 : 8;
    if (wide) {
      wmax = Math.min(vw - 2 * gutter, WCAP);
      left0 = Math.max(gutter, Math.round((vw - wmax) / 2));
    } else {
      wmax = WPHONE;
      left0 = gutter;
    }
    span = vw - 2 * gutter;
    document.body.classList.toggle('wide', wide);
    holder.style.marginLeft = left0 + 'px';
    thumb.setAttribute('aria-valuemax', Math.round(wmax));
    drawRuler();
  }
  const natural = () => (wide ? wmax : span);
  const xOf = (w) => (wide ? left0 + w : left0 + ((w - WMIN) / (wmax - WMIN)) * span);
  const wOf = (x) => (wide ? x - left0 : WMIN + ((x - left0) / span) * (wmax - WMIN));

  function drawRuler() {
    const H = 44, NS = 'http://www.w3.org/2000/svg';
    let out = '';
    if (wide) {
      for (let v = 0; v <= wmax + gutter; v += 10) {
        const x = Math.round(left0 + v) + 0.5;
        const h = v % 100 === 0 ? 12 : v % 50 === 0 ? 7 : 4;
        out += `<line class="tick" x1="${x}" x2="${x}" y1="${H}" y2="${H - h}"/>`;
        if (v % 100 === 0 && v > 0 && left0 + v + 26 < vw && !BPS.some((b) => Math.abs(b - v) < 60))
          out += `<text class="num" x="${x + 3}" y="${H - 5}">${v}</text>`;
      }
    } else {
      for (let v = WMIN; v <= wmax; v += 20) {
        const x = Math.round(xOf(v)) + 0.5;
        // keep the end labels clear of the tall ticks
        const h = v % 100 === 0 && v > WMIN + 60 && v < wmax - 100 ? 9 : 4;
        out += `<line class="tick" x1="${x}" x2="${x}" y1="${H}" y2="${H - h}"/>`;
      }
      for (const v of [WMIN, wmax]) {
        const x = xOf(v);
        out += `<text class="num" x="${v === WMIN ? x + 3 : x - 3}" y="${H - 5}" text-anchor="${v === WMIN ? 'start' : 'end'}">${v}</text>`;
      }
    }
    BPS.forEach((b, i) => {
      if (b > wmax) return;
      const x = Math.round(xOf(b)) + 0.5;
      out += `<g class="bp" data-i="${i}"><line x1="${x}" x2="${x}" y1="${H}" y2="${H - 16}"/>` +
        `<text x="${x + 4}" y="${H - 7}">${b}</text></g>`;
    });
    svg.innerHTML = out;
    guides.innerHTML = wide ? BPS.filter((b) => b <= wmax).map((b) => `<i style="left:${xOf(b)}px"></i>`).join('') : '';
  }

  /* ---------- the wordmark follows the width ---------- */

  function fitMark() {
    const t = clamp((W - WMIN) / (WPHONE - WMIN), 0, 1);
    const stretch = 62 + 63 * t;
    mark.style.fontStretch = probe.style.fontStretch = stretch.toFixed(2) + '%';
    const room = mark.clientWidth;
    const w = probe.getBoundingClientRect().width;
    if (w > 0) mark.style.fontSize = ((room / w) * 200 * 0.995).toFixed(2) + 'px';
  }

  /* ---------- flip: blocks glide from where they were to where they now are ---------- */

  let s = 1;
  function shot(scale) {
    const fr = frame.getBoundingClientRect();
    const m = new Map();
    for (const n of flips) {
      if (!n.getClientRects().length) continue;
      const r = n.getBoundingClientRect();
      m.set(n.dataset.key + (m.has(n.dataset.key) ? '+' : ''), { n, x: (r.left - fr.left) / scale, y: (r.top - fr.top) / scale });
    }
    return m;
  }
  function flip(before, after) {
    for (const [key, a] of after) {
      const o = a.n._o || (a.n._o = { x: 0, y: 0, vx: 0, vy: 0 });
      const b = before.get(key);
      if (!b) { o.x = 0; o.y = 18; o.vx = 0; o.vy = 0; continue; }
      const lx = a.x - o.x, ly = a.y - o.y;
      const bo = b.n._o || { vx: 0, vy: 0 };
      o.x = b.x - lx;
      o.y = b.y - ly;
      if (b.n !== a.n) { o.vx = bo.vx; o.vy = bo.vy; }
    }
    wake();
  }

  /* ---------- width ---------- */

  let W = 375;
  let shown = -1;
  function apply(w) {
    w = clamp(w, WMIN - 40, wmax + (wide ? gutter - 4 : 200));
    const crossing = bpOf(w) !== bpOf(W) && shown >= 0;
    const before = crossing && !calm.matches ? shot(s) : null;
    W = w;
    s = wide ? 1 : Math.min(1, span / W);
    frame.style.width = W + 'px';
    frame.style.transform = s < 1 ? `scale(${s})` : '';
    frame.classList.toggle('scaled', s < 1);
    fitMark();
    holder.style.height = frame.offsetHeight * s + 'px';
    if (before) flip(before, shot(s));
    if (bpOf(W) !== shown) {
      shown = bpOf(W);
      svg.querySelectorAll('.bp').forEach((g) => g.classList.toggle('on', +g.dataset.i === shown - 1));
      bump.v += 5;
      wake();
    }
    const x = xOf(W);
    const half = thumb.offsetWidth / 2;
    const tx = clamp(x, half + 4, vw - half - 4);
    thumb.style.transform = `translateX(${(tx - half).toFixed(2)}px) scale(${1 + bump.x * 0.02})`;
    val.textContent = Math.round(clamp(W, WMIN, wmax));
    edge.style.left = x + 'px';
    placeHint(tx, half);
  }
  function hideHint() {
    if (hint.classList.contains('gone')) return;
    hint.classList.add('gone');
    setTimeout(() => { hint.hidden = true; }, 450);
  }
  function placeHint(tx, half) {
    if (hint.classList.contains('gone')) return;
    const hw = hint.offsetWidth;
    const right = tx + half + 12;
    if (right + hw < vw - 8) { hint.textContent = wide ? 'drag the edge →' : 'drag →'; hint.style.transform = `translateX(${right}px)`; }
    else { hint.textContent = wide ? '← drag the edge' : '← drag'; hint.style.transform = `translateX(${tx - half - 12 - hint.offsetWidth}px)`; }
  }
  function announce() {
    const v = Math.round(clamp(W, WMIN, wmax));
    thumb.setAttribute('aria-valuenow', v);
    thumb.setAttribute('aria-valuetext', `${v} pixels wide, ${['one column', 'two columns', 'editorial'][bpOf(v)]} layout`);
  }

  /* ---------- motion ---------- */

  const spring = { v: 0, target: null };        // the width, when nobody holds it
  const bump = { x: 0, v: 0 };                   // the readout thumps at a breakpoint
  let raf = 0, last = 0;
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    raf = 0;
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    let busy = false;
    if (spring.target != null && (held == null || follow)) {
      const k = spring.k || 140, c = 2 * (spring.z || 0.8) * Math.sqrt(k);
      const a = -k * (W - spring.target) - c * spring.v;
      spring.v += a * dt;
      let w = W + spring.v * dt;
      if (Math.abs(w - spring.target) < 0.15 && Math.abs(spring.v) < 2) { w = spring.target; spring.target = null; spring.v = 0; announce(); }
      apply(w);
      busy = true;
    }
    // block springs. a little underdamped, so they land with a small overshoot.
    const K = 380, C = 2 * 0.62 * Math.sqrt(K);
    for (const n of flips) {
      const o = n._o;
      if (!o || (o.x === 0 && o.y === 0 && o.vx === 0 && o.vy === 0)) continue;
      for (let i = 0; i < 2; i++) {
        const h = dt / 2;
        o.vx += (-K * o.x - C * o.vx) * h; o.x += o.vx * h;
        o.vy += (-K * o.y - C * o.vy) * h; o.y += o.vy * h;
      }
      if (Math.abs(o.x) < 0.2 && Math.abs(o.y) < 0.2 && Math.abs(o.vx) < 4 && Math.abs(o.vy) < 4) {
        o.x = o.y = o.vx = o.vy = 0;
        n.style.transform = '';
        n.style.opacity = '';
      } else {
        n.style.transform = `translate(${o.x.toFixed(2)}px, ${o.y.toFixed(2)}px)`;
        // text in flight dims a little, so two blocks crossing don't read as a collision
        n.style.opacity = (1 - 0.45 * Math.min(1, Math.hypot(o.x, o.y) / 260)).toFixed(3);
        busy = true;
      }
    }
    if (bump.x || bump.v) {
      bump.v += (-500 * bump.x - 18 * bump.v) * dt;
      bump.x += bump.v * dt;
      if (Math.abs(bump.x) < 0.01 && Math.abs(bump.v) < 0.05) bump.x = bump.v = 0;
      busy = true;
      const half = thumb.offsetWidth / 2;
      const tx = clamp(xOf(W), half + 4, vw - half - 4);
      thumb.style.transform = `translateX(${(tx - half).toFixed(2)}px) scale(${1 + bump.x * 0.02})`;
    }
    if (busy) wake();
  }
  function goTo(w, k, z) {
    w = clamp(w, WMIN, wmax);
    if (calm.matches) { spring.target = null; apply(w); announce(); return; }
    spring.target = w; spring.k = k; spring.z = z;
    wake();
  }

  /* ---------- hands ---------- */

  // soft detents: near a breakpoint the edge gets sticky, then lets go
  const ZONE = 18;
  function detent(w) {
    for (const b of BPS) {
      const d = w - b;
      if (Math.abs(d) < ZONE) { const t = Math.abs(d) / ZONE; return b + d * t * t * t; }
    }
    return w;
  }
  // past the ends it gets heavy instead of stopping dead
  function band(w) {
    if (w > wmax) return wmax + (wide ? 18 : 60) * (1 - Math.exp(-(w - wmax) / (wide ? 60 : 200)));
    if (w < WMIN) return WMIN - 30 * (1 - Math.exp(-(WMIN - w) / 80));
    return w;
  }
  let held = null, follow = false, grabOff = 0, lastX = 0, lastT = 0, vel = 0;
  function down(e) {
    if (e.button > 0) return;
    held = e.pointerId;
    e.currentTarget.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    hideHint();
    // grabbing the thumb or edge keeps the offset; tapping the ruler jumps there
    const onHandle = e.currentTarget === edge || e.target.closest('.thumb');
    grabOff = onHandle ? xOf(W) - e.clientX : 0;
    spring.target = null; spring.v = 0;
    lastX = e.clientX; lastT = e.timeStamp; vel = 0;
    // on the ruler the width chases the finger on a stiff spring; on the edge it is held directly
    follow = !onHandle;
    if (follow) goTo(detent(wOf(e.clientX)), 420, 0.8);
    e.preventDefault();
  }
  function move(e) {
    if (held !== e.pointerId) return;
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = 0.7 * vel + 0.3 * ((e.clientX - lastX) / dt) * 1000;
    lastX = e.clientX; lastT = e.timeStamp;
    const w = band(detent(wOf(e.clientX + grabOff)));
    if (follow) { spring.target = w; spring.k = 420; spring.z = 0.8; wake(); }
    else { spring.target = null; apply(w); }
  }
  function up(e) {
    if (held !== e.pointerId) return;
    held = null;
    document.body.classList.remove('dragging');
    if (follow) { follow = false; const t = clamp(spring.target ?? W, WMIN, wmax); goTo(BPS.find((b) => Math.abs(t - b) < ZONE * 1.6) ?? t, 220, 0.72); announce(); return; }
    // land: carry a little momentum, then settle on the nearest detent if close
    let land = wOf(xOf(W) + vel * 0.08);
    land = clamp(land, WMIN, wmax);
    for (const b of BPS) if (Math.abs(land - b) < ZONE * 1.6) land = b;
    spring.v = (vel / (wide ? 1 : span / (wmax - WMIN))) * 0.25;
    goTo(land, 180, 0.7);
    announce();
  }
  for (const n of [edge, $('.ruler')]) {
    n.addEventListener('pointerdown', down);
    n.addEventListener('pointermove', move);
    n.addEventListener('pointerup', up);
    n.addEventListener('pointercancel', up);
  }

  thumb.addEventListener('keydown', (e) => {
    const cur = spring.target ?? W;
    let w = null;
    const step = e.shiftKey ? 100 : 10;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') w = cur + step;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') w = cur - step;
    if (e.key === 'PageUp') w = [...BPS, wmax].find((b) => b > cur + 1) ?? wmax;
    if (e.key === 'PageDown') w = [WMIN, ...BPS].reverse().find((b) => b < cur - 1) ?? WMIN;
    if (e.key === 'Home') w = WMIN;
    if (e.key === 'End') w = wmax;
    if (w == null) return;
    e.preventDefault();
    hideHint();
    goTo(w, 200, 0.75);
    announce();
  });

  // the small title appears once the large one scrolls away, like an app
  new IntersectionObserver(([en]) => {
    document.body.classList.toggle('titled', !en.isIntersecting && bpOf(W) === 0);
  }, { rootMargin: '-88px 0px 0px 0px' }).observe(mark);

  // only the window's width matters; the page growing taller is not a resize
  let rs = 0, started = false, seenW = 0;
  new ResizeObserver(() => {
    if (!started || root.clientWidth === seenW) return;
    seenW = root.clientWidth;
    clearTimeout(rs);
    rs = setTimeout(() => {
      const wasMax = W >= wmax - 1 || W >= natural() - 1;
      const oldWide = wide;
      stage();
      if (wasMax || oldWide !== wide) { spring.target = null; apply(natural()); }
      else apply(clamp(W, WMIN, wmax));
      announce();
    }, 80);
  }).observe(root);

  /* ---------- start: the phone layout opens into whatever you are on ---------- */

  const go = () => {
    started = true;
    stage();
    seenW = vw;
    const end = natural();
    if (calm.matches) {
      apply(end);
      document.body.classList.add('ready');
      announce();
      return;
    }
    const start = wide ? 375 : WPHONE;
    apply(start);
    document.body.classList.add('ready');
    setTimeout(() => goTo(end, wide ? 70 : 60, wide ? 0.86 : 0.8), 750);
    announce();
  };
  Promise.race([document.fonts.load('800 100px Archivo'), new Promise((r) => setTimeout(r, 2000))]).then(go);
  window.edgeDebug = { get W() { return W; }, apply, goTo, get s() { return s; } };
})();
</script>
</body>
</html>
